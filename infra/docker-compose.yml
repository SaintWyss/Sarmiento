services:
  hbbs:
    image: rustdesk/rustdesk-server:latest
    command: hbbs -r hbbr:21117
    ports:
      - "21114:21114/tcp"   # web console OSS (limitado)
      - "21115:21115/tcp"
      - "21116:21116/tcp"
      - "21116:21116/udp"   # rendezvous
      - "21118:21118/tcp"
    volumes:
      - ./data:/root
    depends_on: [hbbr]
    restart: unless-stopped
  hbbr:
    image: rustdesk/rustdesk-server:latest
    command: hbbr
    ports:
      - "21117:21117/tcp"   # relay
      - "21119:21119/tcp"
    volumes:
      - ./data:/root
    restart: unless-stopped
