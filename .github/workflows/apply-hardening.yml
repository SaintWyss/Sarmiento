name: Apply Sarmiento 1.0.1 hardening

on:
  push:
    branches:
      - agent/sarmiento-1.0.1-hardening
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sarmiento-1.0.1-hardening
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: control-plane/pyproject.toml

      - name: Apply deterministic hardening transform
        run: |
          cat ops/hardening/part-00.pyfrag ops/hardening/part-01.pyfrag > /tmp/apply_hardening.py
          python /tmp/apply_hardening.py .

      - name: Install and validate Python
        run: |
          python -m pip install -e "./control-plane[dev]"
          ruff check --fix control-plane/src control-plane/tests agent/sarmiento_agent.py ops/init_env.py
          ruff format control-plane/src control-plane/tests agent/sarmiento_agent.py ops/init_env.py
          ruff check control-plane/src control-plane/tests agent/sarmiento_agent.py ops/init_env.py
          python -m compileall -q control-plane/src control-plane/migrations agent/sarmiento_agent.py ops/init_env.py
          (cd control-plane && pytest -q)
          (cd control-plane && SARMIENTO_DATABASE_URL=sqlite:////tmp/sarmiento-hardening.db alembic upgrade head)

      - name: Validate shell and frontend JavaScript
        run: |
          bash -n agent/install-linux.sh agent/install-macos.sh viewer/install-linux.sh viewer/install-macos.sh viewer/sarmiento-open.sh control-plane/entrypoint.sh ops/backup.sh ops/restore.sh ops/smoke.sh
          node --check front/app.js

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            README.md \
            docs/SECURITY.md \
            control-plane/src/sarmiento/models.py \
            control-plane/src/sarmiento/schemas.py \
            control-plane/src/sarmiento/services.py \
            control-plane/src/sarmiento/api.py \
            control-plane/src/sarmiento/main.py \
            control-plane/src/sarmiento/security.py \
            control-plane/migrations/versions/20260712_0002_agent_rotation.py \
            control-plane/tests/test_api.py \
            control-plane/tests/test_security.py \
            agent/sarmiento_agent.py \
            agent/sarmiento-agent.ps1 \
            agent/install-windows.ps1 \
            front/app.js \
            front/sw.js
          git commit -m "fix: harden enrollment and agent credential rotation"
          git push origin HEAD:agent/sarmiento-1.0.1-hardening
