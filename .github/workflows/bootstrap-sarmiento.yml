name: Bootstrap Sarmiento 1.0

on:
  push:
    branches:
      - agent/sarmiento-1.0

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out delivery branch
        uses: actions/checkout@v4
        with:
          ref: agent/sarmiento-1.0
          fetch-depth: 0

      - name: Reconstruct verified source archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : > /tmp/sarmiento-src.b64
          for sha in \
            c65624f2067b51f568e5341bc8d5fbd53d7e999f \
            dec0ffdc5f450c553ca9abd55a30535d373a7246 \
            46190cad468b0c7e5fcb2ff7624d9f5b08da9c4a \
            6b8b14c4e2fc97a0a6807ca56f0dec5c5fcb2e05 \
            3533a90bd3de8ceeb98057c7f110644f262ed86a \
            c2bcf3fb96848b9442989a1695efcd7bc9bdeeef \
            bb85b6aa003c933f187469ca8b15b2fe10ffd4ad \
            be8cde16fb879f02c77a2828fe4955ec89d9477e \
            8012f6fc98759ae631be13f1cf08089216ca1ecd \
            a43691ec7eddf0c57786afd285b9c0d14df89a85 \
            a25c3bf105fc06e79de9096414be6362e4e15cf7
          do
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" \
              | jq -r '.content' \
              | tr -d '\n' \
              | base64 -d >> /tmp/sarmiento-src.b64
          done

          base64 -d /tmp/sarmiento-src.b64 > /tmp/sarmiento-src.tar.gz
          echo "9a91a20e2e35285dc58e8164af8c40c1af49b3b612f2732566e3cfec1cd41815  /tmp/sarmiento-src.tar.gz" | sha256sum --check -
          tar -xzf /tmp/sarmiento-src.tar.gz -C .
          rm -f infra/docker-compose.yml .github/workflows/bootstrap-sarmiento.yml

      - name: Commit complete product tree
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: deliver Sarmiento 1.0 production system"
          git push origin HEAD:agent/sarmiento-1.0
