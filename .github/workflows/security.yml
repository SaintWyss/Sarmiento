name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  python-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: control-plane/pyproject.toml
      - name: Install project and scanners
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./control-plane pip-audit bandit
      - name: Dependency audit
        run: pip-audit
      - name: Static security scan
        run: bandit -q -r control-plane/src agent/sarmiento_agent.py ops/init_env.py -ll
