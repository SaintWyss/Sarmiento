name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: control-plane/pyproject.toml
      - name: Install
        run: python -m pip install -e "./control-plane[dev]"
      - name: Test
        working-directory: control-plane
        run: pytest -q
      - name: Lint
        run: ruff check control-plane/src control-plane/tests agent/sarmiento_agent.py ops/init_env.py
      - name: Compile
        run: python -m compileall -q control-plane/src control-plane/migrations agent/sarmiento_agent.py ops/init_env.py
      - name: Migration smoke
        working-directory: control-plane
        env:
          SARMIENTO_DATABASE_URL: sqlite:////tmp/sarmiento-ci.db
        run: alembic upgrade head

  scripts-and-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Validate shell and frontend JavaScript
        run: |
          bash -n agent/install-linux.sh agent/install-macos.sh viewer/install-linux.sh viewer/install-macos.sh viewer/sarmiento-open.sh control-plane/entrypoint.sh ops/backup.sh ops/restore.sh ops/smoke.sh
          node --check front/app.js
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; $failed = $true }
          }
          if ($failed) { exit 1 }
      - name: Validate Compose
        run: |
          cp infra/.env.example infra/.env
          docker compose --env-file infra/.env -f infra/compose.yaml config --quiet
      - name: Verify pinned runtime images
        run: |
          docker manifest inspect postgres:16.4-alpine >/dev/null
          docker manifest inspect caddy:2.8.4-alpine >/dev/null
          docker manifest inspect rustdesk/rustdesk-server:1.1.15 >/dev/null
      - name: Build application image
        run: docker build -f control-plane/Dockerfile .
