name: Apply Python formatting

on:
  push:
    branches:
      - agent/sarmiento-1.0
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sarmiento-1.0
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Format and verify
        run: |
          set -euo pipefail
          python -m pip install "ruff>=0.8,<1" -e "./control-plane[dev]"
          ruff check --fix control-plane/src control-plane/tests agent/sarmiento_agent.py ops/init_env.py || true
          ruff format control-plane/src control-plane/tests agent/sarmiento_agent.py ops/init_env.py
          ruff check control-plane/src control-plane/tests agent/sarmiento_agent.py ops/init_env.py
          (cd control-plane && pytest -q)
      - name: Commit formatting
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent/sarmiento_agent.py control-plane/src control-plane/tests ops/init_env.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: satisfy Python lint gate"
          git push origin HEAD:agent/sarmiento-1.0
