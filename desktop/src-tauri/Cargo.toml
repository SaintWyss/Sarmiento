[package]
name = "sarmiento-desktop"
version = "1.0.0"
description = "Native workstation controller for Sarmiento"
authors = ["Sarmiento contributors"]
license = "MIT"
repository = "https://github.com/SaintWyss/Sarmiento"
edition = "2021"

[lib]
name = "sarmiento_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-deep-link = "=2.6.3"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tokio = { version = "1", features = ["macros", "sync"] }
url = "2"
